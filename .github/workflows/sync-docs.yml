name: Sync docs from upstream

# When an upstream OvenMediaLabs/* repo pushes a change inside its
# `docs-site/` tree, its notify workflow dispatches a `docs-changed`
# event here. We re-pull all three upstreams' docs-site/ into our
# docs/<source>/ folder, then commit and push the result directly to
# main. No PR — docs syncs are expected to ship as-is because the
# review already happened upstream.
#
# Manual trigger (`workflow_dispatch`) is also exposed for an ad-hoc
# re-sync from the Actions UI.

on:
  repository_dispatch:
    types: [docs-changed]
  workflow_dispatch:

# Coalesce bursts: if three upstream merges arrive in quick succession,
# the newest run cancels the in-flight one and resyncs everything from
# fresh. End state matches the latest dispatch instead of being stuck
# on whichever event happened to land first. We always sync all three
# upstreams, so cancelling mid-run is safe — the next run picks up
# every change.
concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.OML_DOCS_SYNC_PAT }}
          ref: main

      # The PAT covers the private OvenMediaEngineEnterprise repo too,
      # so make HTTPS clones use it for any github.com URL the sync
      # script touches.
      - name: Authenticate git for private upstreams
        run: |
          git config --global url."https://x-access-token:${{ secrets.OML_DOCS_SYNC_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Configure git author
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Run sync
        # Always sync all three upstreams. Ignoring the dispatch's
        # `source` payload makes coalescing trivial: every run lands
        # the same end state regardless of which upstream triggered.
        run: bash scripts/sync-docs.sh

      # `concurrency` coalesces competing *sync* runs, but it does not
      # serialize this push against OTHER writers to main (a merged PR,
      # the deploy bot). Between this job's checkout and its push, main
      # can advance — a bare `git push` then fails non-fast-forward and
      # the freshly-built `chore: sync` commit is silently dropped. So
      # on rejection, rebase the sync commit onto the latest main and
      # retry. A rebase conflict (someone hand-edited docs/<src>/) is a
      # real problem: fail loudly instead of pushing a guessed merge.
      - name: Push if changes
        run: |
          if ! git log @{upstream}..HEAD --oneline | grep -q .; then
            echo "no new commits to push"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto latest origin/main"
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::sync commit does not rebase cleanly onto origin/main"
              exit 1
            fi
          done
          echo "::error::could not push after 5 attempts (persistent contention on main)"
          exit 1
